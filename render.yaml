services:
  # ---------------------------------------------------------------------------
  # 1. TalentIQ Unified Web Service (Backend API + React Frontend)
  # ---------------------------------------------------------------------------
  - type: web
    name: talentiq-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/test
    envVars:
      - key: PORT
        value: 8080
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false

  # ---------------------------------------------------------------------------
  # 2. TalentIQ Frontend (Static Site on Render CDN - Optional Standalone)
  # ---------------------------------------------------------------------------
  - type: web
    name: talentiq-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
